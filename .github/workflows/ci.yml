name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The site balances across both backends, over Traefik's self-signed
      # default certificate, and plain HTTP redirects to HTTPS.
      - name: Fetch the site through Traefik
        run: |
          podman exec -i circuit-traefik sh -eu <<'EOF'
          out=""
          for _ in 1 2 3 4 5 6; do
            out="$out $(curl -sSfk --resolve app.test:443:127.0.0.1 https://app.test/)"
          done
          echo "$out"
          echo "$out" | grep -q 'backend a'
          echo "$out" | grep -q 'backend b'
          r=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' -H 'Host: app.test' http://127.0.0.1/)
          echo "$r"
          echo "$r" | grep -Eq '^30[178] https://app.test/'
          EOF
      # A new site lands in the watched dynamic directory, so Traefik serves
      # it without a restart.
      - name: Add a site, then check it's served by the same process
        working-directory: examples/local
        run: |
          pid=$(podman exec circuit-traefik systemctl show -P MainPID traefik)
          conn3x apply -auto-approve -var second_site=true
          conn3x plan -detailed-exitcode -var second_site=true
          podman exec -i circuit-traefik sh -eu <<'EOF'
          for _ in $(seq 30); do
            curl -sfk --resolve b.test:443:127.0.0.1 https://b.test/ | grep -qx 'backend b' && break
            sleep 1
          done
          curl -sSfk --resolve b.test:443:127.0.0.1 https://b.test/ | grep -qx 'backend b'
          EOF
          [ "$(podman exec circuit-traefik systemctl show -P MainPID traefik)" = "$pid" ]
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
