name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Fetch the site through Traefik
        working-directory: examples/local
        run: podman exec -i circuit-traefik sh < check.sh
      # A new site lands in the watched dynamic directory, so Traefik serves
      # it without a restart.
      - name: Add a site, then check it's served by the same process
        working-directory: examples/local
        run: |
          pid=$(podman exec circuit-traefik systemctl show -P MainPID traefik)
          conn3x apply -auto-approve -var second_site=true
          conn3x plan -detailed-exitcode -var second_site=true
          podman exec -i circuit-traefik sh -eu <<'EOF'
          for _ in $(seq 30); do
            curl -sfk --resolve b.test:443:127.0.0.1 https://b.test/ | grep -qx 'backend b' && break
            sleep 1
          done
          curl -sSfk --resolve b.test:443:127.0.0.1 https://b.test/ | grep -qx 'backend b'
          EOF
          [ "$(podman exec circuit-traefik systemctl show -P MainPID traefik)" = "$pid" ]
      # Restarting the container boots systemd again, so this checks Traefik
      # comes back by itself, still serves the site, and the plan has nothing
      # to do.
      - name: Restart the host, then check the site and the plan
        working-directory: examples/local
        run: |
          podman restart circuit-traefik
          for _ in $(seq 60); do
            case $(podman exec circuit-traefik systemctl is-system-running 2>/dev/null) in running|degraded) break ;; esac
            sleep 1
          done
          podman exec -i circuit-traefik sh < check.sh
          conn3x plan -detailed-exitcode -var second_site=true
      # A fresh host gets the previous release, then the circuit's own pin is
      # applied over it, the way someone raises traefik_version.
      - name: Upgrade from Traefik 3.7.15 on a fresh host, then plan again with no changes
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: |
          ./down.sh
          ./up.sh
          conn3x init
          conn3x apply -auto-approve -var traefik_version=3.7.15 \
            -var 'checksums={amd64="5b9f51199fcb7a3b5f7ae0f9dae8dcf01efadafd92c5fca96ea2822eca81f8e6",arm64="1866d8e831b95d14b599bb59eb20d2033b979c0cb1e347b48a0866a9b810454e"}'
          podman exec circuit-traefik traefik version | grep -Eq '^Version: +3\.7\.15$'
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          want=$(sed -n '/variable "traefik_version"/,/^}/s/.*default *= *"\(.*\)"/\1/p' ../../variables.tf)
          podman exec circuit-traefik traefik version | grep -Eq "^Version: +$want\$"
      - name: Check the upgraded Traefik serves the site
        working-directory: examples/local
        run: podman exec -i circuit-traefik sh < check.sh
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
